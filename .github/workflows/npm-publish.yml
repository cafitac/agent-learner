name: npm-publish

on:
  workflow_dispatch:
  push:
    tags:
      - "npm-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run npm wrapper tests
        run: |
          npm test
          npm pack --dry-run
      - name: Install uv
        run: python -m pip install uv
      - name: Sync Python environment
        run: uv sync --extra dev --python 3.13
      - name: Run Python tests
        run: uv run --python 3.13 --extra dev pytest -q
      - name: Run source-tree smoke QA
        run: |
          uv run --python 3.13 --extra dev agent-learner qa-codex-smoke
          uv run --python 3.13 --extra dev agent-learner qa-claude-smoke
      - name: Build Python distributions
        run: uv build
      - name: Verify installed wheel smoke
        shell: bash
        run: |
          wheel_env="$(mktemp -d)/wheel-env"
          uv venv "$wheel_env" --python 3.13
          uv pip install --python "$wheel_env/bin/python" dist/*.whl
          "$wheel_env/bin/agent-learner" --help
          "$wheel_env/bin/agent-learner" qa-codex-smoke
          "$wheel_env/bin/agent-learner" qa-claude-smoke
      - name: Publish npm wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
