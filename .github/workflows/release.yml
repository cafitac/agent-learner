name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run npm wrapper tests
        run: |
          npm test
          npm pack --dry-run
      - name: Install uv
        run: python -m pip install uv
      - name: Sync environment
        run: uv sync --extra dev --python 3.13
      - name: Run tests
        run: uv run --python 3.13 --extra dev pytest -q
      - name: Run adapter smoke QA
        run: |
          uv run --python 3.13 --extra dev agent-learner qa-codex-smoke
          uv run --python 3.13 --extra dev agent-learner qa-claude-smoke
      - name: Build distributions
        run: uv build
      - name: Verify installed wheel smoke
        shell: bash
        run: |
          wheel_env="$(mktemp -d)/wheel-env"
          uv venv "$wheel_env" --python 3.13
          uv pip install --python "$wheel_env/bin/python" dist/*.whl
          "$wheel_env/bin/agent-learner" --help
          "$wheel_env/bin/agent-learner" qa-codex-smoke
          "$wheel_env/bin/agent-learner" qa-claude-smoke
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
