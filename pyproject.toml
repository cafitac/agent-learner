[project]
name = "agent-learner"
version = "0.2.0"
description = "Reusable self-learning engine for agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "cafitac" }]
keywords = ["agent", "learning", "workflow", "codex", "claude", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cafitac/agent-learner"
Repository = "https://github.com/cafitac/agent-learner"
Issues = "https://github.com/cafitac/agent-learner/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[tool.uv]
package = true

[project.scripts]
agent-learner = "agent_learner.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
agent_learner = ["frontend_dist/*", "frontend_dist/assets/*"]

[tool.setuptools.packages.find]
where = ["src"]
