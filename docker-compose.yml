services:
  agent-learner-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8766:8766"
    working_dir: /app
    command:
      [
        "agent-learner",
        "dashboard",
        "--project-root",
        "/app",
        "--host",
        "0.0.0.0",
        "--port",
        "8766",
        "--no-build"
      ]
